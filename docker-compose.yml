version: '3.8'

services:
  moderador-bot:
    build: .
    container_name: valak-moderador
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GROUP_ID=${GROUP_ID}
      - WEBAPP_URL=${WEBAPP_URL}
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./:/app
      - /app/node_modules
    command: node bot.js
